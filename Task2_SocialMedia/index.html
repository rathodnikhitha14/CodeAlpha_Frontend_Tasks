<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect - Social Media</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f3f0ff}
header{background:#7c3aed;color:white;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.container{max-width:500px;margin:20px auto;padding:10px}
.post{background:white;border-radius:12px;padding:15px;margin-bottom:20px;box-shadow:0 2px 8px #ddd}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:40px;height:40px;background:#7c3aed;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.post img{width:100%;border-radius:10px;margin:10px 0;height:200px;object-fit:cover}
.actions{display:flex;gap:20px;margin-top:10px}
.actions button{border:none;background:none;font-size:18px;cursor:pointer}
.liked{color:#7c3aed;font-weight:bold}
.newpost{background:white;padding:15px;border-radius:12px;margin-bottom:20px;display:flex;gap:10px}
.newpost input{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px}
.newpost button{background:#7c3aed;color:white;border:none;padding:10px 20px;border-radius:20px;cursor:pointer}
</style>
</head>
<body>
<header>Connect - Social Feed 💜</header>
<div class="container">
<div class="newpost">
<input id="newText" placeholder="What's on your mind, Nikhitha?">
<button onclick="addPost()">Post</button>
</div>

<div id="feed">
<div class="post">
<div class="post-head"><div class="avatar">N</div><b>Nikhitha Rathod</b></div>
<p>Completed my Frontend Internship Tasks! So excited 💜 #CodeAlpha</p>
<img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
<div class="actions">
<button onclick="like(this)">💜 Like (<span>12</span>)</button>
<button>💬 Comment</button>
</div>
</div>

<div class="post">
<div class="post-head"><div class="avatar">C</div><b>CodeAlpha</b></div>
<p>Great work by all interns! Keep building 🚀</p>
<img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97">
<div class="actions">
<button onclick="like(this)">💜 Like (<span>45</span>)</button>
<button>💬 Comment</button>
</div>
</div>
</div>
</div>
<script>
function like(btn){let s=btn.querySelector('span');s.innerText=parseInt(s.innerText)+1;btn.classList.add('liked')}
function addPost(){let t=document.getElementById('newText').value;if(!t)return;let f=document.getElementById('feed');f.innerHTML=`<div class="post"><div class="post-head"><div class="avatar">N</div><b>Nikhitha Rathod</b></div><p>${t}</p><div class="actions"><button onclick="like(this)">💜 Like (<span>0</span>)</button><button>💬 Comment</button></div></div>`+f.innerHTML;document.getElementById('newText').value=''}
</script>
</body>
</html>
