<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy - Ecommerce</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
header{background:#7c3aed;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
.cart{background:white;color:#7c3aed;padding:8px 15px;border-radius:20px;font-weight:bold}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;padding:20px}
.card{border:1px solid #ddd;border-radius:12px;padding:15px;text-align:center}
.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
.card h3{margin:10px 0}
.price{color:#7c3aed;font-weight:bold;font-size:18px}
.btn{background:#7c3aed;color:white;border:none;padding:10px 20px;border-radius:8px;margin-top:10px;cursor:pointer;width:100%}
.btn:hover{background:#6d28d9}
</style>
</head>
<body>
<header>
<h2>ShopEasy 🛒</h2>
<div class="cart">Cart: <span id="count">0</span></div>
</header>
<div class="products">
<div class="card">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
<h3>Smart Watch</h3>
<p class="price">₹2,999</p>
<button class="btn" onclick="add()">Add to Cart</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
<h3>Running Shoes</h3>
<p class="price">₹1,999</p>
<button class="btn" onclick="add()">Add to Cart</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">
<h3>Headphones</h3>
<p class="price">₹1,499</p>
<button class="btn" onclick="add()">Add to Cart</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1525590409433-cfa59e1f7b1b">
<h3>Backpack</h3>
<p class="price">₹899</p>
<button class="btn" onclick="add()">Add to Cart</button>
</div>
</div>
<script>
let c=0;
function add(){c++;document.getElementById('count').innerText=c;alert('Added to cart! Total: '+c)}
</script>
</body>
</html>
